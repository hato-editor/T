<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人の名前にするゲーム</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f4f7fb;color:#172033}
main{max-width:720px;margin:auto;padding:20px 14px 36px}
h1{text-align:center;margin:8px 0 4px;font-size:28px}.sub{text-align:center;color:#667085;margin:0 0 18px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px #00000012;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:12px;padding:13px 17px;font-size:16px;font-weight:700;background:#2563eb;color:white;touch-action:manipulation}
button.secondary{background:#e8edf5;color:#24324a}button.warn{background:#f59e0b}
button:disabled{opacity:.4}
#slots{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}
.slot{min-height:64px;border:2px dashed #cbd5e1;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;background:#f8fafc}
.slot.filled{border-style:solid;background:#eff6ff;border-color:#93c5fd}
#log{font-size:14px;color:#475467;max-height:180px;overflow:auto}.logitem{padding:8px 0;border-bottom:1px solid #edf0f5}
.big{font-size:19px;text-align:center;font-weight:800;min-height:28px}
.rules{line-height:1.7;font-size:14px;color:#475467}
@media(max-width:500px){#slots{grid-template-columns:repeat(4,1fr)}.slot{min-height:58px;font-size:24px}}
</style>
</head>
<body>
<main>
<h1>「人の名前にする」ゲーム</h1>
<p class="sub">ランダムな文字を並べて、人名っぽい名前を作ろう！</p>

<div class="card">
  <div class="big" id="status">「スタート」を押して開始</div>
  <div id="slots"></div>
  <div class="row">
    <button id="start">スタート</button>
    <button id="next" class="secondary" disabled>次の文字</button>
    <button id="voice" class="secondary">🔊 読み上げ</button>
  </div>
</div>

<div class="card">
  <h3>出た文字</h3>
  <div class="big" id="char">—</div>
  <div class="row">
    <button id="dakuten" class="warn" disabled>゛濁音にする</button>
    <button id="handakuten" class="warn" disabled>゜半濁音にする</button>
  </div>
</div>

<div class="card">
<h3>ルール</h3>
<div class="rules">
① 文字数を4〜8文字からランダムに決定。<br>
② ひらがなを1文字ランダムに選び、入れる位置もランダムに決定。<br>
③ 最初に出た文字は1文字目には入らない。<br>
④ 同じ文字が何度出てもOK。<br>
⑤ 濁音・半濁音は最初から候補に含めず、出た後に変化させられる。<br>
⑥ 全てのマスが埋まったら完成！
</div>
</div>

<div class="card">
<h3>履歴</h3><div id="log">まだありません</div>
</div>
</main>

<script>
const kana = [..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん"];
const dak = {"か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご","さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ","た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど","は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ"};
const han = {"は":"ぱ","ひ":"ぴ","ふ":"ぷ","へ":"ぺ","ほ":"ぽ"};

let n=0, slots=[], used=0, firstChar=null, current=null, started=false;

const $=id=>document.getElementById(id);
function render(){
  $("slots").innerHTML=slots.map((x,i)=>`<div class="slot ${x?"filled":""}">${x||"？"}</div>`).join("");
}
function start(){
  n=Math.floor(Math.random()*5)+4; slots=Array(n).fill(""); used=0; firstChar=null; current=null; started=true;
  $("start").disabled=true; $("next").disabled=false; $("char").textContent="—";
  $("status").textContent=`${n}文字の名前を作ります`;
  $("log").innerHTML="";
  render();
  $("dakuten").disabled=true;$("handakuten").disabled=true;
}
function next(){
  if(!started || used>=n)return;
  let ch=kana[Math.floor(Math.random()*kana.length)];
  let positions=[...Array(n).keys()].filter(i=>!slots[i]);
  if(firstChar===null) positions=positions.filter(i=>i!==0);
  // 4文字以上なら最初の文字が1文字目以外になる位置を必ず確保
  if(!positions.length) positions=[...Array(n).keys()].filter(i=>!slots[i]);
  const pos=positions[Math.floor(Math.random()*positions.length)];
  slots[pos]=ch; used++; current={pos,ch};
  if(firstChar===null) firstChar=ch;
  $("char").textContent=`「${ch}」 → ${pos+1}文字目`;
  $("status").textContent=used===n?"完成！":"次の文字を出せます";
  $("dakuten").disabled=!dak[ch]; $("handakuten").disabled=!han[ch];
  render();
  $("log").innerHTML=`<div class="logitem">${used}. 「${ch}」を ${pos+1}文字目に配置</div>`+$("log").innerHTML;
  if(used===n){$("next").disabled=true;$("start").disabled=false;$("status").textContent=`完成！ ${slots.join("")}`;}
}
function change(type){
  if(!current)return;
  const ch=current.ch, to=type==="dak"?dak[ch]:han[ch];
  if(!to)return;
  slots[current.pos]=to; current.ch=to;
  $("char").textContent=`「${to}」 → ${current.pos+1}文字目`;
  $("dakuten").disabled=true;$("handakuten").disabled=true;
  render();
}
$("start").onclick=start;$("next").onclick=next;
$("dakuten").onclick=()=>change("dak");$("handakuten").onclick=()=>change("han");
$("voice").onclick=()=>{if(slots.some(Boolean)){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(slots.join("")))}};
render();
</script>
</body>
</html>
